<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stick Timer</title>
<style>
  :root{--c:#ff5a1f;--body:#e3e1dc;--body2:#cfccc5;--edge:#b8b4ab;--ink:#1d1d1f;--sub:#6e6a63;--key:#efede8;--knob:#ff5a1f;--kink:#fff;--off:#c4c0b8;--disp:#0d0d0d;--mono:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif}
  *{box-sizing:border-box;font-variant-numeric:tabular-nums}
  button,input,select,textarea{font-family:var(--mono)}
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;color:#e8ecf5;font:14px/1.45 var(--mono)}
  #desk{position:fixed;inset:0;overflow:hidden;user-select:none;background:transparent}
  #status{margin-left:auto;color:#6b7387;font-size:12px}

  /* ---------- the device ---------- */
  #dial{position:absolute;left:0;top:0;z-index:1000;touch-action:none;cursor:grab}
  #dial.glide{transition:transform .38s cubic-bezier(.25,1.25,.4,1)}
  #dial .seal{position:absolute;inset:6%;border-radius:50%;background:#000;filter:blur(9px);opacity:.75;transform:translateY(6px);transition:opacity .2s,transform .25s,filter .25s}
  #dial.drag .seal{opacity:.45;transform:translateY(22px) scale(1.05);filter:blur(18px)}
  #dial .body{position:absolute;inset:0;transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
  #dial.drag{cursor:grabbing}
  #dial.drag .body{transform:scale(1.06)}
  #dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  #dial.stuck .body{animation:tchuc .42s cubic-bezier(.3,1.4,.5,1)}
  @keyframes tchuc{0%{transform:scale(1.06,.92)}35%{transform:scale(.97,1.03)}65%{transform:scale(1.01,.99)}100%{transform:scale(1)}}
  #dial .snapring{opacity:0;transition:opacity .15s}
  #dial.snap .snapring{opacity:1}
  #dial{transition:opacity .25s}
  #dial.tucked:not(:hover):not(.drag):not(.open),#dial.tucked.preview{opacity:var(--tuck-op,1)}
  #dial .hub{cursor:pointer}
  #dial.turning,#dial.turning *{cursor:grabbing!important}

  /* ---------- orbit: hardware keys that pop out around the device ---------- */
  #orbit{position:absolute;left:0;top:0;width:0;height:0;z-index:1500}
  .ob{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    background:var(--key);border:1px solid var(--edge);
    box-shadow:0 8px 16px -8px #000c;color:var(--ink);
    transform:translate(0,0) scale(.3);opacity:0;pointer-events:none;
    transition:transform .38s cubic-bezier(.2,1.5,.4,1),opacity .18s,filter .15s,margin .08s,box-shadow .08s}
  .ob svg{width:15px;height:15px}
  .ob:hover{filter:brightness(1.06)}
  .ob:active{margin-top:-17px;box-shadow:0 0 0 var(--edge),0 4px 10px -6px #000c}
  .ob.main{width:46px;height:46px;margin:-23px 0 0 -23px;background:var(--knob);color:var(--kink);border-color:transparent;box-shadow:0 8px 16px -8px #000c}
  .ob.main:active{margin-top:-20px}
  .ob.main svg{width:17px;height:17px}
  .ob .tip{position:absolute;top:100%;margin-top:7px;font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#9a978f;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
  .ob:hover .tip{opacity:1}
  #orbit.open .ob{opacity:1;pointer-events:auto}

  /* ---------- card: quiet panel, one display, three tabs ---------- */
  #card{position:absolute;width:300px;height:486px;z-index:2000;border-radius:18px;padding:12px 12px 10px;max-height:calc(100vh - 70px);display:flex;flex-direction:column;color:var(--ink);
    background:var(--body);border:1px solid var(--edge);box-shadow:inset 0 1px 0 #ffffff18,0 24px 50px -20px #000;
    transform:scale(.25);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,1.25,.4,1),opacity .2s}
  #card.open{transform:scale(1);opacity:1;pointer-events:auto}
  #card input{user-select:text}
  #card.anim .st{animation:up .4s cubic-bezier(.2,1,.4,1) both;animation-delay:calc(var(--i,0)*30ms + 50ms)}
  @keyframes up{from{opacity:0;transform:translateY(6px)}}
  .disp{background:var(--disp);border-radius:12px;padding:10px 12px 10px;box-shadow:inset 0 1px 6px #000}
  .mk{font:9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#8d8b86;display:flex;align-items:center;gap:6px}
  .mk .live{width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
  .mk.paused .live{background:#444;box-shadow:none}
  .dm{display:block;width:100%;height:46px;margin:6px 0 8px}
  .dbar{display:flex;gap:2px}.dbar i{flex:1;height:3px;background:#ffffff10;border-radius:1px}.dbar i.on{background:var(--c)}
  .ttl{display:flex;align-items:baseline;gap:6px;padding:10px 4px 2px}
  .dn{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none;border-radius:3px;min-width:0}
  .dn[contenteditable=true]{background:#80808022;padding:0 4px;user-select:text}
  .dsub{margin-left:auto;font:10.5px var(--mono);color:var(--sub);flex:none}
  .pri{color:var(--c);font-weight:700}
  .banner{display:flex;align-items:center;gap:6px;margin:8px 0 0;padding:8px 8px 8px 12px;border-radius:12px;background:var(--c-soft);font-size:12.5px}
  .banner span{flex:1}
  .tabs{display:flex;gap:16px;margin:12px 4px 8px;border-bottom:1px solid var(--edge)}
  .tabs span{position:relative;font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--sub);padding:0 0 8px;cursor:pointer}
  .tabs span:hover{color:var(--ink)}
  .tabs span.on{color:var(--ink)}
  .tabs span.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--c)}
  .tabs em{font-style:normal;margin-left:4px;opacity:.6}
  .pane{flex:1;min-height:0;overflow:auto;padding:2px 4px 4px}
  .pane::-webkit-scrollbar{width:5px}.pane::-webkit-scrollbar-thumb{background:var(--edge);border-radius:9px}
  .chips{display:flex;gap:4px;align-items:center;margin:4px 0 10px}
  .chip{font:12px var(--mono);border-radius:8px;padding:5px 0;width:44px;text-align:center;color:var(--ink);cursor:pointer;background:var(--key)}
  .chip:hover{outline:1px solid var(--edge)}
  .chip.on{background:var(--knob);color:var(--kink)}
  .chip-u{font:10px var(--mono);color:var(--sub);margin-left:4px;letter-spacing:.08em;text-transform:uppercase}
  .subs .sub{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;cursor:pointer}
  .subs .sub.d{color:var(--sub);text-decoration:line-through}
  .ck{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--sub);flex:none;display:grid;place-items:center;cursor:pointer}
  .ck:hover{border-color:var(--ink)}
  .ck.on{background:var(--c);border-color:var(--c)}
  .ck.on::after{content:"";width:6px;height:3px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
  .inp{width:100%;background:var(--key);border:1px solid transparent;color:var(--ink);border-radius:9px;padding:8px 10px;font:12.5px var(--mono);outline:none;margin-top:6px}
  .inp::placeholder{color:var(--sub)}
  .inp:focus{border-color:var(--c)}
  .inp.ghost{background:none;padding:5px 0;margin:0;border-radius:0}
  .inp.ghost:focus{border-color:transparent}
  .acts{display:flex;gap:6px;margin-top:12px}
  .btn{padding:8px 12px;border-radius:10px;border:0;background:var(--key);color:var(--ink);font:12.5px var(--mono);font-weight:600;cursor:pointer;transition:transform .06s,filter .15s}
  .btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
  .btn.pri{background:var(--knob);color:var(--kink)}
  .btn.wide{flex:1}
  .rows .row{display:flex;align-items:center;gap:10px;padding:8px 6px;font-size:13px;cursor:pointer;border-radius:9px;position:relative}
  .rows .row:hover{background:var(--key)}
  .rows .row.cur{background:var(--key)}
  .rows .row.cur::before{content:"";position:absolute;left:-2px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--c)}
  .rows .row.over-t{box-shadow:inset 0 2px 0 var(--c)}
  .rows .row.dragging{opacity:.35}
  .rows .row.done .n{color:var(--sub);text-decoration:line-through}
  .row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .est{font:11px var(--mono);color:var(--sub);padding:1px 4px;border-radius:5px}
  .est:hover{color:var(--ink);background:var(--body2)}
  .x{opacity:0;color:var(--sub);cursor:pointer;font-size:11px}.row:hover .x,.sub:hover .x{opacity:1}.x:hover{color:#ff3b30}
  .donehd{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin:14px 6px 4px;cursor:pointer}
  .donehd:hover{color:var(--ink)}
  .empty{color:var(--sub);font:10.5px var(--mono);text-align:center;padding:18px 0;text-transform:uppercase;letter-spacing:.1em}
  .themes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:4px}
  .th{aspect-ratio:1;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:transform .12s}
  .th:hover{transform:scale(1.07)}
  .th.on{box-shadow:0 0 0 2px var(--body),0 0 0 3.5px var(--c)}
  .th svg{width:100%;height:100%;overflow:visible}
  .dicebtn{background:var(--key);font-size:18px}
  .th.dicebtn svg{width:42%;height:42%;color:var(--ink)}
  .thname{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--sub);text-align:center;margin:10px 0 12px}
  .pick{display:flex;gap:8px}
  .pick label{flex:1;display:flex;align-items:center;gap:8px;font:10px var(--mono);color:var(--sub);letter-spacing:.08em;text-transform:uppercase;background:var(--key);border-radius:9px;padding:5px 8px;cursor:pointer}
  .pick input[type=color]{width:18px;height:18px;border:0;border-radius:50%;background:none;padding:0;cursor:pointer;flex:none}
  .pick input[type=color]::-webkit-color-swatch-wrapper{padding:0}.pick input[type=color]::-webkit-color-swatch{border:1px solid #00000040;border-radius:50%}
  .tog{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-top:12px;cursor:pointer}
  .sw{width:26px;height:15px;border-radius:9px;background:var(--body2);position:relative;flex:none}
  .sw::after{content:"";position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--sub);transition:transform .15s,background .15s}
  .tog.on .sw{background:var(--c)}.tog.on .sw::after{transform:translateX(11px);background:#fff}
  .sizes{display:flex;align-items:center;gap:4px;margin-top:14px;font:10px var(--mono);color:var(--sub);letter-spacing:.1em;text-transform:uppercase}
  .sizes span{cursor:pointer;padding:3px 9px;border-radius:7px;color:var(--ink)}
  .sizes span:first-child{margin-left:auto}
  .sizes span.on{background:var(--key)}
  .ft{margin-top:8px;padding:8px 4px 0;border-top:1px solid var(--edge);font:10px var(--mono);color:var(--sub);letter-spacing:.06em}
  .ft b{color:var(--ink);font-weight:600}
  /* v17: quick add + queue */
  .qa{position:relative;margin:10px 0 4px}
  .qa .inp{margin:0;padding-right:66px}
  .qchip{position:absolute;right:7px;top:50%;transform:translateY(-50%);font:10.5px var(--mono);color:var(--c);background:var(--c-soft);border-radius:6px;padding:2px 6px;pointer-events:none}
  .qchip:empty{display:none}
  .hintline{font:9.5px var(--mono);color:var(--sub);letter-spacing:.03em;margin:2px 2px 6px;opacity:.85}
  .rows .ck{border-radius:50%;width:15px;height:15px}
  .row .go{opacity:0;width:20px;height:20px;display:grid;place-items:center;border-radius:6px;color:var(--ink);flex:none}
  .row .go svg{width:10px;height:10px}
  .row:hover .go{opacity:.75}.row .go:hover{opacity:1;color:var(--c);background:var(--body2)}
  .rows .row.sel{box-shadow:inset 0 0 0 1px var(--edge)}
  .rows .row.leaving{opacity:0;transform:translateX(12px);transition:opacity .2s .12s,transform .2s .12s}
  .rows .row.leaving .ck{background:var(--c);border-color:var(--c)}
  .rows .row.leaving .n{text-decoration:line-through;color:var(--sub)}
  .ft{display:flex;align-items:center;gap:8px}
  .gear{margin-left:auto;cursor:pointer;width:24px;height:24px;display:grid;place-items:center;border-radius:7px;color:var(--sub)}
  .gear:hover,.gear.on{color:var(--ink);background:var(--key)}
  .gear svg{width:15px;height:15px}
  .rng{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-top:12px}.rng input{flex:1;accent-color:var(--knob)}.rng b{font:10.5px var(--mono);color:var(--sub);width:32px;text-align:right;font-weight:400}
  /* v20: settings */
  .sec{font:9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sub);margin:16px 2px 8px;padding-bottom:6px;border-bottom:1px solid var(--edge)}
  .pane>.sec:first-child{margin-top:4px}
  .opt{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;margin:0;padding:8px 2px;cursor:default}
  .opt.tog{cursor:pointer}
  .opt small,.opt.col small{display:block;font-size:10.5px;color:var(--sub);margin-top:2px;line-height:1.35}
  .opt.col{flex-direction:column;align-items:stretch;gap:6px}
  .opt .row2{display:flex;justify-content:space-between}.opt .row2 b{font:11px var(--mono);color:var(--ink)}
  .opt input[type=range]{width:100%;accent-color:var(--knob)}
  .seg{display:flex;gap:2px;background:var(--key);border-radius:8px;padding:2px}
  .seg span{padding:3px 10px;border-radius:6px;cursor:pointer;font:10.5px var(--mono);color:var(--sub)}
  .seg span.on{background:var(--body);color:var(--ink)}
  .keys>div{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 2px;color:var(--ink)}
  .keys kbd{font:10px var(--mono);background:var(--key);border:1px solid var(--edge);border-bottom-width:2px;border-radius:5px;padding:1px 6px;margin-left:3px;color:var(--ink)}
  .pick{margin-top:8px}
  /* v21: first-run tour */
  #tour{position:fixed;inset:0;z-index:5000;pointer-events:none;opacity:0;transition:opacity .3s}
  #tour.on{opacity:1}
  #tour .tspot,#tour .tpulse{position:fixed;opacity:0;transition:left .35s cubic-bezier(.3,1.2,.4,1),top .35s cubic-bezier(.3,1.2,.4,1),width .35s,height .35s,border-radius .35s,opacity .3s}
  #tour .tspot{box-shadow:0 0 0 200vmax rgba(4,5,8,.6)}
  #tour .tpulse{border:2px solid var(--knob);animation:tpulse 1.6s ease-out infinite}
  #tour.spot .tspot,#tour.spot .tpulse{opacity:1}
  #tour:not(.spot){background:rgba(4,5,8,.6)}
  @keyframes tpulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.18);opacity:0}}
  #tour .tbub{position:fixed;width:280px;pointer-events:auto;background:var(--body);color:var(--ink);border:1px solid var(--edge);border-radius:16px;padding:14px 14px 12px;
    box-shadow:0 20px 50px -16px #000;transition:left .35s cubic-bezier(.3,1.2,.4,1),top .35s cubic-bezier(.3,1.2,.4,1)}
  #tour .tbub.pop{animation:tpop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes tpop{from{opacity:0;transform:translateY(6px) scale(.97)}}
  #tour .tbub.ok{box-shadow:0 0 0 2px var(--knob),0 20px 50px -16px #000}
  #tour .tcount{font:9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--knob);margin-bottom:6px}
  #tour .tt{font-size:15px;font-weight:650;margin-bottom:4px}
  #tour .tb{font-size:12.5px;line-height:1.5;color:var(--ink);opacity:.8}
  #tour kbd{font:10.5px var(--mono);background:var(--key);border:1px solid var(--edge);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--ink)}
  #tour .tkeys{display:grid;gap:6px;margin:6px 0 10px}
  #tour .tact{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;align-items:center}
  #tour .tskip{font:10.5px var(--mono);color:var(--sub);cursor:pointer;padding:4px 2px}
  #tour .tskip:first-child{margin-right:auto}
  #tour .tskip:hover{color:var(--ink)}
  .tourbtn{width:100%;margin-top:12px}
</style>
</head>
<body>
<div id="desk">
  <div id="dial"><div class="seal"></div><div class="body"><svg id="dsvg" viewBox="-100 -100 200 200"></svg></div></div>
  <div id="orbit"></div>
  <div id="card"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const P=(r,a)=>{const t=(a-90)*Math.PI/180;return[r*Math.cos(t),r*Math.sin(t)]}; // a: degrees clockwise from 12
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const fmtH=s=>{const m=Math.round(s/60);return m>=60?`${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`:`${m}m`};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- color + themes: body, knob cap, LEDs, display ----------
const hex2rgb=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const rgb2hex=a=>'#'+a.map(v=>Math.round(cl(v,0,255)).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A.map((v,i)=>v+(B[i]-v)*cl(t,0,1)))};
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return rgb2hex([f(0)*255,f(8)*255,f(4)*255])}
const lum=h=>{const[r,g,b]=hex2rgb(h);return(.299*r+.587*g+.114*b)/255};
const Lt=(h,t)=>mix(h,'#ffffff',t),Dk=(h,t)=>mix(h,'#000000',t);
// a = LED color with plenty of time, b = getting close, c = last stretch
function mkTheme(name,body,knob,led,o={}){const dark=lum(body)<.42;
  return{name,body,knob,a:led,b:'#ffd21f',c:'#ff2a2a',brk:'#2f7bff',disp:'#0d0d0d',glow:.5,...o,
    body2:Dk(body,dark?.3:.1),edge:dark?Lt(body,.14):Dk(body,.2),sub:dark?mix(body,'#ffffff',.5):mix(body,'#000000',.5),
    key:dark?Lt(body,.08):Lt(body,.4),off:o.off||(dark?Lt(body,.1):Dk(body,.12)),ink:dark?'#efeee9':'#1d1d1f',dark}}
const THEMES=[
  mkTheme('Aluminum','#e3e1dc','#ff5a1f','#ff5a1f'),
  mkTheme('Black','#202022','#ff5a1f','#ff5a1f',{off:'#333336'}),
  mkTheme('Amber','#17120c','#ffb21f','#ffb21f',{b:'#ff7a1f'}),
  mkTheme('Mint','#0f1712','#3dff9a','#3dff9a'),
  mkTheme('Graphite','#2e2e31','#ff5a1f','#ff5a1f'),
  mkTheme('Paper','#f3f2ef','#8e8c87','#ff3b30',{b:'#ff8a00'}),
  mkTheme('Cobalt','#2a49c9','#f2f1ee','#ffffff',{b:'#ffd21f',c:'#ff5a1f',brk:'#7affc4'}),
  mkTheme('Orange','#ff5a1f','#1d1d1f','#fff3c4',{b:'#ffe14d',c:'#1d1d1f',brk:'#1d1d1f',disp:'#1d1d1f'})];
const BODIES=[['aluminum','#e3e1dc'],['paper','#f3f2ef'],['sand','#dcd3c2'],['graphite','#2b2b2d'],['night','#131314'],['sage','#c9d0c3'],['cobalt','#2a49c9'],['orange','#ff5a1f'],['pink','#f2c7c9'],['concrete','#b9b7b2'],['olive','#5b5e45']];
const CAPS=[['orange','#ff5a1f'],['blue','#1f5fff'],['green','#1fae6a'],['yellow','#ffd21f'],['red','#ff2a2a'],['gray','#8e8c87'],['white','#f2f1ee'],['black','#1d1d1f'],['lilac','#9b7bff']];
function randomTheme(){const pk=a=>a[Math.random()*a.length|0];const[bn,b]=pk(BODIES);let cn,k,n=0;do{[cn,k]=pk(CAPS)}while(Math.abs(lum(k)-lum(b))<.2&&n++<30);
  let led=pk([k,k,'#ff5a1f','#ff3b30','#1fae6a','#2f9bff','#ffd21f']);if(Math.abs(lum(led)-lum(b))<.15)led=lum(b)>.5?'#ff3b30':'#ffd21f';
  return{...mkTheme(`ST-${10+Math.random()*89|0} ${bn}/${cn}`,b,k,led,{glow:.25+Math.random()*.5}),random:true}}

// ---------- actions ----------
function act(a,v){const t=task();

    case'set':SHOWSET=!SHOWSET;break;

    case'check':{const q=D.tasks.find(z=>z.id===v);if(q){q.done=!q.done;q.doneAt=Date.now();sCheck();if(q.id===D.cur&&q.done)running=false}break}

const tSpot=tourEl.querySelector('.tspot'),tPulse=tourEl.querySelector('.tpulse'),tBub=tourEl.querySelector('.tbub');
const R=el=>{if(!el)return null;const r=el.getBoundingClientRect();return{x:r.left,y:r.top,w:r.width,h:r.height}};
const dialR=(k=1)=>{const r=SIZE*k;return{x:x+SIZE/2-r/2,y:y+SIZE/2-r/2,w:r,h:r,round:true}};
let TOUR=null;
const STEPS=[
  {t:'Welcome to Stick Timer',b:'A timer that sticks to your screen and keeps your tasks. This tour covers the basics in about 30 seconds.',intro:true},
  {t:'Set the time',b:'Drag around the ring to choose the minutes. The scroll wheel works too.',
    on:s=>{s.m0=Math.round(cur().est)},target:()=>dialR(1),done:s=>Math.round(cur().est)!==s.m0},
  {t:'Open the panel',b:'Click the center of the timer to open your tasks.',target:()=>dialR(.56),done:()=>menuOpen},
  {t:'Add a task',b:'Type a name and a duration, like <kbd>Check email 15</kbd>, then press <kbd>Enter</kbd>.',
    on:s=>{s.n0=open().length;needMenu();setTimeout(focusQA,250)},target:()=>R(card.querySelector('.qa')),pre:needMenu,done:s=>open().length>s.n0},
  {t:'Start the timer',b:'Click <b>▶</b> on the task (shown on hover) or <b>Start</b>. <kbd>Space</kbd> also starts and pauses.',
    target:()=>R(card.querySelector('.rows .row:last-child'))||R(card.querySelector('.acts .btn.pri')),pre:needMenu,done:()=>running},
  {t:'Stick it to an edge',b:'Drag the timer by its center until it touches a screen edge. It tucks in and keeps counting.',
    on:()=>{if(menuOpen)closeMenu(true)},target:()=>dialR(1.08),done:()=>!!dock},
  {t:'You are all set',b:`<div class="tkeys">${(MAC?[['⌘ ⌥ N','new task'],['⌘ ⌥ K','open in the center'],['⌘ ⌥ P','start / pause'],['⌘ [ ]','opacity when stuck']]:[['Ctrl Alt N','new task'],['Ctrl Alt K','open in the center'],['Ctrl Alt Space','start / pause'],['Ctrl [ ]','opacity when stuck']]).map(([k,l])=>`<span>${k.split(' ').map(p=>`<kbd>${p}</kbd>`).join('')} ${l}</span>`).join('')}</div>The first three work from any app. You can replay this tour from Settings.`,outro:true}];
function needMenu(){if(!menuOpen){SHOWSET=false;openMenu()}else if(SHOWSET){SHOWSET=false;buildCard()}}
function startTour(){TOUR={i:-1,s:{}};tourEl.classList.add('on');tourStep(0);TOUR.iv=setInterval(tourTick,80)}
function endTour(){if(!TOUR)return;clearInterval(TOUR.iv);TOUR=null;tourEl.classList.remove('on','spot');localStorage.setItem('st23-tour','1')}
function tourStep(i){if(!TOUR)return;if(i>=STEPS.length){endTour();return}TOUR.i=i;TOUR.s={};const S=STEPS[i];S.on&&S.on(TOUR.s);
  const n=STEPS.length-2,k=i;
  tBub.innerHTML=`${S.intro||S.outro?'':`<div class="tcount">${k} of ${n}</div>`}<div class="tt">${S.t}</div><div class="tb">${S.b}</div>
    <div class="tact">${S.intro?'<button class="btn" data-t="end">Skip</button><button class="btn pri" data-t="next">Start tour</button>'
      :S.outro?'<button class="btn pri" data-t="end">Done</button>'
      :'<span class="tskip" data-t="end">Exit tour</span><span class="tskip" data-t="next">Skip step</span>'}</div>`;
  tBub.classList.remove('pop');void tBub.offsetWidth;tBub.classList.add('pop');tourTick()}
function tourTick(){if(!TOUR)return;const S=STEPS[TOUR.i];S.pre&&S.pre();
  if(S.done&&S.done(TOUR.s)){const i=TOUR.i;TOUR.i=-1;sCheck();tBub.classList.add('ok');setTimeout(()=>{tBub.classList.remove('ok');TOUR&&tourStep(i+1)},450);return}
  if(TOUR.i<0)return;
  const r=S.target&&S.target(),VW=innerWidth,VH=innerHeight;tourEl.classList.toggle('spot',!!r);
  if(r){const p=8;Object.assign(tSpot.style,{left:r.x-p+'px',top:r.y-p+'px',width:r.w+2*p+'px',height:r.h+2*p+'px',borderRadius:r.round?'50%':'14px'});
    Object.assign(tPulse.style,{left:r.x-p+'px',top:r.y-p+'px',width:r.w+2*p+'px',height:r.h+2*p+'px',borderRadius:r.round?'50%':'14px'})}
  // bubble: beside the target, away from the card and inside the screen
  const bw=tBub.offsetWidth,bh=tBub.offsetHeight;let bx,by;
  if(!r){bx=VW/2-bw/2;by=VH/2-bh/2}
  else{const cands=[[r.x+r.w+22,r.y+r.h/2-bh/2],[r.x-bw-22,r.y+r.h/2-bh/2],[r.x+r.w/2-bw/2,r.y+r.h+22],[r.x+r.w/2-bw/2,r.y-bh-22]];
    const cr=menuOpen?R(card):null,hit=(X,Y)=>cr&&X<cr.x+cr.w&&X+bw>cr.x&&Y<cr.y+cr.h&&Y+bh>cr.y,fits=(X,Y)=>X>=10&&Y>=10&&X+bw<=VW-10&&Y+bh<=VH-10;
    const c=cands.find(([X,Y])=>fits(X,Y)&&!hit(X,Y))||cands.find(([X,Y])=>fits(X,Y))||cands[0];bx=cl(c[0],10,VW-bw-10);by=cl(c[1],10,VH-bh-10)}
  tBub.style.left=bx+'px';tBub.style.top=by+'px'}
tBub.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;sBtn();b.dataset.t==='next'?tourStep(TOUR.i+1):endTour()});
tBub.addEventListener('pointerdown',e=>e.stopPropagation());

// ---------- desktop shell (Tauri) ----------
// The window covers the whole work area; the OS mouse only reaches us over the shapes we report.
const TAURI=window.__TAURI__||null;
const invoke=(cmd,args)=>TAURI?TAURI.core.invoke(cmd,args).catch(()=>{}):Promise.resolve();
let hitQueued=false,lastHits='';
function reportHits(){if(hitQueued)return;hitQueued=true;requestAnimationFrame(()=>{hitQueued=false;
  const shapes=[{x,y,w:SIZE,h:SIZE,round:true}];
  if(TOUR){const b=tBub.getBoundingClientRect();shapes.push({x:b.left,y:b.top,w:b.width,h:b.height,round:false})}
  if(menuOpen){shapes.push({x:card.offsetLeft,y:card.offsetTop,w:card.offsetWidth,h:card.offsetHeight,round:false});
    for(const b of orbit.children){const r=b.offsetWidth;shapes.push({x:parseFloat(b.style.left)-r/2,y:parseFloat(b.style.top)-r/2,w:r,h:r,round:true})}}
  const key=JSON.stringify(shapes.map(s=>[Math.round(s.x),Math.round(s.y),Math.round(s.w),Math.round(s.h)]));
  if(key!==lastHits){lastHits=key;invoke('set_hit_shapes',{shapes})}})}
{const tt0=tourTick;tourTick=function(){tt0();reportHits()};const te0=endTour;endTour=function(){te0();reportHits()}}
{const a0=apply,l0=layoutMenu,o0=openMenu,c0=closeMenu;
  apply=function(){a0();reportHits()};layoutMenu=function(){l0();reportHits()};
  openMenu=function(){o0();reportHits();setTimeout(reportHits,500)};closeMenu=function(s){c0(s);reportHits()}}
dial.addEventListener('pointerdown',()=>invoke('set_hold',{hold:true}),true);
window.addEventListener('pointerup',()=>invoke('set_hold',{hold:false}),true);
window.addEventListener('pointercancel',()=>invoke('set_hold',{hold:false}),true);
// clicking another app closes the menu
window.addEventListener('blur',()=>{if(menuOpen)closeMenu(true)});
// instant feedback for things that change the dial
dial.addEventListener('mouseenter',()=>drawDial());dial.addEventListener('mouseleave',()=>drawDial());
{const s0=setMinutes,t0=toggle,a1=act;setMinutes=function(m){s0(m);drawDial()};toggle=function(){t0();drawDial()};act=function(a,v){a1(a,v);drawDial()}}
if(TAURI){TAURI.event.listen('toggle-timer',()=>toggle());
  TAURI.event.listen('quick-add',()=>openQuick());TAURI.event.listen('summon',()=>{if(!menuOpen||!HOME)summon()});
  TAURI.event.listen('mouse-zone',e=>{if(!e.payload&&hover){hover=false;drawDial()}})}

// ---------- start ----------
applyTheme();sizeDial();
let placed=false;
function place(){const[W,H]=dims();if(placed||W<300||H<300)return;placed=true;
  let p=null;try{p=JSON.parse(localStorage.getItem('st23-pos')||'null')}catch{}
  if(p&&isFinite(p.x)&&isFinite(p.y)){x=p.x*W;y=p.y*H}else{x=W-SIZE;y=0}
  settle(x,y,{quiet:true});dial.style.visibility='visible'}
dial.style.visibility='hidden';place();
window.addEventListener('resize',place);
buildOrbit();layoutMenu();

// Event-driven: a 4 Hz tick keeps time (wall clock, so it survives sleep/throttling)
// and only repaints the dial when something visible changed.
let lastT=Date.now(),lastKey='';
function tick(){const now=Date.now(),dt=Math.max(0,(now-lastT)/1000);lastT=now;const c=cur();
  if(running){c.spent+=dt;if(!BRK)D.day.sec[c.id]=(D.day.sec[c.id]||0)+dt;
    if(!chimed&&c.spent>=c.est*60){chimed=true;running=false;c.spent=c.est*60;sChime();if(!BRK)D.day.sessions++;save();if(!menuOpen)openMenu();else buildCard()}
    if(Math.floor(now/5000)!==Math.floor((now-dt*1000)/5000))save()}
  const st=state(),key=[Math.floor(st.left*2),hover,menuOpen,dock,running,st.over&&blinkOff(),TH.name,TH.a,TH.body,SIZE].join('|');
  if(key!==lastKey){lastKey=key;drawDial()}
  if(menuOpen)liveCard()}
drawDial();setInterval(tick,250);
if(!localStorage.getItem('st23-tour'))setTimeout(()=>{place();startTour()},900);
</script>
